name: Python tools

on:
  pull_request:
    paths:
      - 'docker/tools/**.py'
      - 'docker/tools/media-download.js'
      - 'docker/wechat-builds.yaml'
      - 'docker/wechat_builds.py'
      - 'docker/download_wechat.py'
      - 'scripts/download-wechat.sh'
      - 'tests/test_*.py'
      - 'tests/media-download.test.cjs'
      - '.github/workflows/python-tools.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML>=6,<7'
      # SQLCipher 4 integration is additionally exercised in research containers.
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/media-download.test.cjs
